[env:esp32dev]
extra_scripts = pre:tools/pre_build.py
; Pinned: unpinned resolves to whatever is latest/cached, and espressif32 8.x+
; ships Arduino-ESP32 core 3.x, which removed ledcSetup/ledcAttachPin (used in
; Backlight.cpp) in favor of a different LEDC API — broke a from-scratch CI
; build while local builds kept working from an already-cached older platform.
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200


lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	boschsensortec/BSEC Software Library@^1.8
	adafruit/RTClib@^2.1.1
	bblanchon/ArduinoJson@^7.0.0
	knolleary/PubSubClient@^2.8

build_flags =
	-D USER_SETUP_LOADED=1
	-D ST7789_DRIVER=1   
	-D TFT_RGB_ORDER=TFT_BGR
	;-D ILI9341_2_DRIVER=1 
	-D TFT_MISO=12
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=-1
	-D TFT_BL=27
	-D TOUCH_CS=33
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_FONT6=1
	-D SPI_FREQUENCY=55000000
