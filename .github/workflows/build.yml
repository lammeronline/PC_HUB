name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  firmware:
    name: Firmware (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware (esp32dev)
        run: pio run -e esp32dev

      - name: Check committed WebUI.h matches WebUI.html
        # Compares decompressed content, not raw gzip bytes: DEFLATE output isn't
        # bit-for-bit reproducible across zlib versions/platforms, so a plain
        # `git diff` on the regenerated file flags false positives whenever CI's
        # Python links a different zlib than whoever last built it locally.
        run: |
          python3 -c "
          import gzip, re, pathlib, sys
          h = pathlib.Path('src/WebUI.h').read_text()
          hexes = re.findall(r'0x([0-9a-fA-F]{2})', h.split('WEB_INDEX_GZ[]')[1])
          embedded = gzip.decompress(bytes(int(x, 16) for x in hexes))
          html = pathlib.Path('src/WebUI.html').read_bytes()
          if embedded != html:
              print('::error::src/WebUI.h does not decompress to the current src/WebUI.html — run \'pio run\' locally and commit the regenerated file.')
              sys.exit(1)
          print('WebUI.h matches WebUI.html (decompressed content identical)')
          "

      - name: Upload firmware.bin
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/esp32dev/firmware.bin
          if-no-files-found: error

  pcagent:
    name: PC Agent (.NET)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: PCAgent
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish
        run: dotnet publish -c Release -o build --no-restore

      - name: Upload PCAgent build
        uses: actions/upload-artifact@v4
        with:
          name: PCAgent
          path: PCAgent/build
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [firmware, pcagent]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: artifacts/firmware

      - name: Download PCAgent artifact
        uses: actions/download-artifact@v4
        with:
          name: PCAgent
          path: artifacts/pcagent

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/firmware/firmware.bin
            artifacts/pcagent/PCAgent.exe
